workflows:
  ios-testflight:
    name: CrewJob iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        APP_STORE_APPLE_ID: "6826008527"
        BUNDLE_ID: "com.crewjob.app"
      xcode: latest
    scripts:
      - name: Sap xep thu muc, cai XcodeGen va tao du an
        script: |
          mkdir -p CrewJob/Resources
          mv App.swift Bridge.swift WebContainer.swift Info.plist GoogleService-Info.plist CrewJob.entitlements CrewJob/
          mv index.html CrewJob/Resources/
          brew install xcodegen
          xcodegen generate
      - name: Tang so build
        script: |
          BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((BUILD + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
          xcodegen generate
      - name: Tao chung chi va ho so ky
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --platform IOS --create --certificate-key @file:/tmp/cert_key
          keychain add-certificates
          xcode-project use-profiles
      - name: Chan doan loi bien dich
        ignore_failure: true
        script: |
          xcodebuild -project CrewJob.xcodeproj -scheme CrewJob -configuration Release -destination 'generic/platform=iOS' -archivePath /tmp/diag.xcarchive archive DEVELOPMENT_TEAM=3KX5TXN6SX CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" > /tmp/diag.log 2>&1
          echo "EXIT=$?"
          echo "===== LOI ====="
          grep -E "error:|error " /tmp/diag.log | sort -u | head -40
          echo "===== CUOI LOG ====="
          tail -25 /tmp/diag.log
      - name: Dong goi
        script: |
          xcode-project build-ipa --project CrewJob.xcodeproj --scheme CrewJob
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
