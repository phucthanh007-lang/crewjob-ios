workflows:
  ios-testflight:
    name: CrewJob iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: codemagic-admin
    environment:
      vars:
        APP_STORE_APPLE_ID: "6826008527"
        BUNDLE_ID: "com.crewjob.app"
      xcode: latest
    scripts:
      - name: Sap xep thu muc, cai XcodeGen va tao du an
        script: |
          mkdir -p CrewJob/Resources
          mv App.swift Bridge.swift WebContainer.swift Info.plist GoogleService-Info.plist CrewJob.entitlements CrewJob/
          mv index.html CrewJob/Resources/
          brew install xcodegen
          xcodegen generate
      - name: Tang so build
        script: |
          BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((BUILD + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
          xcodegen generate
      - name: Dong goi va ky bang Apple Cloud Signing
        script: |
          set -o pipefail
          K="$APP_STORE_CONNECT_PRIVATE_KEY"
          case "$K" in
            @file:*) cp "${K#@file:}" /tmp/asc.p8 ;;
            *) printf '%s\n' "$K" > /tmp/asc.p8 ;;
          esac
          echo "KEY file lines: $(wc -l < /tmp/asc.p8) keyid: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          mkdir -p build/ios/ipa
          cat > /tmp/export.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>3KX5TXN6SX</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          </dict></plist>
          EOT
          xcodebuild -project CrewJob.xcodeproj -scheme CrewJob -configuration Release -destination 'generic/platform=iOS' -archivePath build/CrewJob.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= > /tmp/archive.log 2>&1 || { echo "ARCHIVE FAILED"; grep -E "error:" /tmp/archive.log | sort -u | head -30; tail -15 /tmp/archive.log; exit 1; }
          xcodebuild -exportArchive -archivePath build/CrewJob.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/export.plist -allowProvisioningUpdates -authenticationKeyPath /tmp/asc.p8 -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" > /tmp/export.log 2>&1 || { echo "EXPORT FAILED"; grep -E "error:" /tmp/export.log | sort -u | head -30; tail -15 /tmp/export.log; exit 1; }
          ls -la build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
