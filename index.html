<meta charset="utf-8">
<title>CrewJob</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one phone-width column like a bridge logbook. Chart-paper ground, navy ink, lifebuoy-orange accent; rank epaulettes carry the identity. */
:root{
  --bg:#E8EDF0; --surface:#F6F8F9; --surface-2:#EDF1F3; --ink:#0C2233; --ink-2:#4A6070; --line:#CBD5DB;
  --accent:#D9481F; --accent-fg:#FFFFFF;
  --brand:#0B3F6B; --hero-a:#0B3F6B; --hero-b:#1470B8; --hero-ink:#FFFFFF;
  --head-bg:#0C2233; --head-fg:#EAF1F5; --head-line:#2B4A5F;
  --ok:#16784E; --warn:#A8620A; --soon:#245FA6; --bad:#B8322A;
  --gold:#D6A92B; --epa-deck:#143B57; --epa-eng:#4B3075;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09161E; --surface:#0F2230; --surface-2:#142B3B; --ink:#E4EDF2; --ink-2:#8EA5B3; --line:#223E4E;
  --accent:#FF7F55; --accent-fg:#1B0A03;
  --brand:#8FC2F2; --hero-a:#0A2B4A; --hero-b:#0F4C85; --hero-ink:#FFFFFF;
  --head-bg:#061019; --head-fg:#E4EDF2; --head-line:#1F3A4A;
  --ok:#4CC38A; --warn:#E5A84B; --soon:#6FA8E8; --bad:#F07A70;
  --epa-deck:#0B2A3F; --epa-eng:#3A2660; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09161E; --surface:#0F2230; --surface-2:#142B3B; --ink:#E4EDF2; --ink-2:#8EA5B3; --line:#223E4E;
  --accent:#FF7F55; --accent-fg:#1B0A03;
  --brand:#8FC2F2; --hero-a:#0A2B4A; --hero-b:#0F4C85; --hero-ink:#FFFFFF;
  --head-bg:#061019; --head-fg:#E4EDF2; --head-line:#1F3A4A;
  --ok:#4CC38A; --warn:#E5A84B; --soon:#6FA8E8; --bad:#F07A70;
  --epa-deck:#0B2A3F; --epa-eng:#3A2660; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);letter-spacing:.01em}

/* header */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand)}
.brand svg{width:24px;height:24px;color:var(--accent)}
.roles{display:flex;border:1px solid var(--head-line);border-radius:6px;overflow:hidden;min-width:0}
.roles button{background:transparent;border:0;color:var(--head-fg);padding:6px 12px;font-size:13px;opacity:.75;white-space:nowrap}
.roles button+button{border-left:1px solid var(--head-line)}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);opacity:1;font-weight:600}
.main{padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}

/* banner */
.demo{font-size:12.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;background:var(--surface-2)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;background:transparent;border:0;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--brand);font-weight:700}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.sec-title{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--ink-2);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--ink);color:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.pill{--c:var(--ink-2);display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--surface))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.ok{--c:var(--ok)} .pill.warn{--c:var(--warn)} .pill.soon{--c:var(--soon)} .pill.bad{--c:var(--bad)} .pill.plain::before{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:700;margin-left:4px;text-align:center}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters2 .wide{grid-column:1/-1}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=search],input[type=number],input[type=date],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.4}

/* epaulette */
.epa{width:30px;height:44px;border-radius:3px;background:var(--epa-deck);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 4px;flex:none}
.epa.eng{background:var(--epa-eng)}
.epa i{display:block;height:4px;background:var(--gold)}
.epa.rating i{height:2px;opacity:.8}

/* job */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.job-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;width:100%;text-align:left;background:transparent;border:0}
.job-rank{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.job-rank small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-2);margin-left:6px;text-transform:none}
.job-meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:13px;color:var(--ink-2)}
.job-meta b{color:var(--ink);font-weight:500}
.sal{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.sal small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:3px}
.lockt{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent)}
.job-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 12px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-2)}
.verified svg{width:14px;height:14px;color:var(--ok)}
.detail{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.facts dt{font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:1px 0 0}
.req{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.req li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}
.locked-note{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact span{font-family:var(--f-mono);font-size:15px;user-select:all}

/* docs */
.sumbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.sumbar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.legend div{display:flex;flex-direction:column}
.legend .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.doc h3{font-size:16px;font-weight:600}
.doc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;margin:0}
.doc-meta dt{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.doc-meta dd{margin:1px 0 0}
.photo{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.thumb{width:56px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form .full{grid-column:1/-1}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 12px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks input{margin-top:3px;accent-color:var(--accent)}

/* price */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.quote .price{font-family:var(--f-display);font-weight:700;font-size:24px;text-align:right;white-space:nowrap}
.quote .full{grid-column:1/-1}

/* me */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.plan>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.plan>div.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.plan ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.price-big{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1}
.push{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.push svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:1px}
.switch{display:flex;gap:8px;align-items:center}
.switch input{accent-color:var(--accent);width:18px;height:18px}

.prof{margin:0;display:flex;flex-direction:column}
.prof>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 2px;border-bottom:1px solid var(--line)}
.prof>div:last-child{border-bottom:0}
.prof dt{color:var(--ink-2);min-width:0}
.prof dd{margin:0;font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.btn.full{width:100%;padding:13px 14px;font-size:15px;border-radius:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.thumbwrap{position:relative;display:inline-block}
.thumbwrap .thumb{width:84px;height:62px;display:block}
.thumbwrap .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;line-height:1;padding:0}
.chg{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 12px;font-size:13px}
.welcome{padding-block:40px 28px;display:flex;flex-direction:column;gap:16px}
.welcome .brand{font-size:36px}
.welcome .brand svg{width:34px;height:34px}
.tag{margin:-8px 0 8px;color:var(--ink-2)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.choice:hover{border-color:var(--accent)}
.choice .ic{width:46px;height:46px;border-radius:50%;background:var(--head-bg);color:var(--accent);display:grid;place-items:center}
.choice .ic svg{width:24px;height:24px}
.choice .ct{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.choice .cd{color:var(--ink-2);font-size:14.5px}
.choice .go{color:var(--accent);font-weight:600;margin-top:4px}
.lnk{align-self:flex-start;background:transparent;border:0;color:var(--ink-2);text-decoration:underline;padding:4px 0;font-size:13px}
.more{border-top:1px dashed var(--line);padding-top:10px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.tagline{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.greet{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:.01em}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.hero-l{opacity:.85;font-size:14px}
.hero-t{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.hero-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:17px}
.hero-r b{font-family:var(--f-display);font-size:26px}
.prog{height:10px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:#5FD6A0;border-radius:6px}
.hero-n{font-size:13.5px;opacity:.9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.stat .l{color:var(--ink-2)}
.sech{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.sech h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sech h2 svg{width:20px;height:20px;color:var(--warn)}
.sech button{background:transparent;border:0;color:var(--brand);font-weight:700;padding:4px 0}
.att{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:14px;padding:12px 14px}
.att .ai{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.att .ai svg{width:24px;height:24px}
.att b{display:block;font-size:16px}
.att.bad{--c:var(--bad)} .att.warn{--c:var(--warn)} .att.soon{--c:var(--soon)} .att.ok{--c:var(--ok)}
.mjob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mj-b{display:flex;flex-direction:column;min-width:0}
.pick{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pickrow{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:left;width:100%}
.pickrow:last-child{border-bottom:0}
.pickrow .pi{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand);flex:none}
.pickrow .pi svg{width:22px;height:22px}
.pickrow .pn{flex:1;min-width:0;font-weight:500}
.pickrow .chev{color:var(--ink-2);font-size:22px}
label.btn{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;cursor:pointer;text-align:center}
label.btn svg{width:22px;height:22px}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filein{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.job,.doc,.quote{transition:border-color .15s}}
@media (max-width:420px){.sal{font-size:20px}.job-rank{font-size:23px}.brand{font-size:22px}}
.drow{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--ok));border-radius:12px;overflow:hidden;--c:var(--ok)}
.drow.bad{--c:var(--bad)}.drow.warn{--c:var(--warn)}.drow.soon{--c:var(--soon)}
.drow-top{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;background:transparent;border:0;color:var(--ink)}
.drow-top input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.drow .dt{flex:1;min-width:0}.drow .dt b{display:block;font-size:15.5px;line-height:1.25}.drow .dt span{display:block;font-size:13px;color:var(--ink-2)}
.dd{flex:none;text-align:right;font-size:13px;font-weight:600;color:var(--c);max-width:38%}
.drow-more{border-top:1px solid var(--line);padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto}.thumbs img{height:84px;border-radius:6px;border:1px solid var(--line)}.thumbs.big img{height:140px}
.dprice{font-weight:600;color:var(--ink)!important;margin-top:2px}
.dgrp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-top:4px}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bsel{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.bsel input{width:20px;height:20px;accent-color:var(--accent)}
a.btn{display:inline-block;text-decoration:none;text-align:center}

 else if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:triệu|tr\b|củ)/))){v.cur='VND';v.salaryMin=v.salaryMax=Math.round(num(m[1])*1e6)}
 else if((m=s.match(/(\d[\d.,]{2,6})\s*(?:-|–|—|~|đến|to)\s*(\d[\d.,]{2,6})/))){v.cur='USD';v.salaryMin=+m[1].replace(/[.,]/g,'');v.salaryMax=+m[2].replace(/[.,]/g,'')}
 else if((m=s.match(/(?:\$\s*(\d[\d.,]{2,5})|(\d[\d.,]{2,5})\s*(?:usd|\$|đô))/))){const x=+(m[1]||m[2]).replace(/[.,]/g,'');v.cur='USD';v.salaryMin=v.salaryMax=x}
 const vnOwner=/(chủ tàu\s*(?:là\s*)?(?:vn\b|việt)|chủ\s*vn\b|tàu\s*(?:vn\b|việt nam|trong nước|nội địa)|trong nước|nội địa|vn owner)/.test(s);
 const foreignOwner=/(chủ tàu\s*(?:nước ngoài|ngoại|nn\b)|foreign|nước ngoài|chủ ngoại|hy lạp|nhật bản|hàn quốc)/.test(s);
 v.owner=vnOwner?'vn':foreignOwner?'foreign':(v.cur==='VND'?'vn':'foreign');
 let dm=s.match(/(?:nhập tàu|join|eta|sign on|lên tàu)[^\d]{0,15}(\d{1,2})[\/.](\d{1,2})/);
 if(!dm){for(const x of s.matchAll(/(?<!\d)(\d{1,2})[\/.](\d{1,2})(?!\d)/g)){if(+x[1]<=31&&+x[2]<=12&&+x[1]>0&&+x[2]>0){dm=x;break}}}
 if(dm&&+dm[1]<=31&&+dm[2]>=1&&+dm[2]<=12){let y=TODAY.getFullYear();let dt=new Date(y,+dm[2]-1,+dm[1]);if(dt<TODAY)dt=new Date(y+1,+dm[2]-1,+dm[1]);v.joinDate=iso(dt)}
 m=s.match(/(\d{1,2})\s*(?:tháng|months?|mths?)/);if(m)v.months=+m[1];
 m=t.match(/(0\d[\d .]{7,11}\d)/);if(m)v.contact=m[1].trim();
 m=s.match(/(\d{2,3})\s*k\s*dwt/);if(m)v.dwt=m[1]+'.000 DWT';
 m=s.match(/(panama|marshall|liberia|singapore flag|vietnam|hong kong|bahamas)/);if(m)v.flag=m[1].replace(' flag','').replace(/^./,c=>c.toUpperCase());
 return v;
}

function within11(exp){if(!exp)return false;const lim=new Date(TODAY);lim.setMonth(lim.getMonth()+11);return parseD(exp)<=lim}
const fmtVN=iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso||'')?iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
function parseVN(str){
 str=String(str||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(str))return str;
 const m=str.match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{4})$/)||str.match(/^(\d{2})(\d{2})(\d{4})$/);if(!m)return null;
 const y=+m[3],mo=+m[2],d=+m[1],dt=new Date(y,mo-1,d);if(y<1990||y>2100||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
 return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');

/* ===== Bộ phân tích chữ đọc từ ảnh giấy tờ thuyền viên (chạy hoàn toàn trên máy) ===== */
/* Thời hạn chuẩn (năm) theo loại giấy, dùng để suy ra ngày còn thiếu. */
const OCR_VALID={COC:5,GMDSS:5,BST:5,PSCRB:5,AFF:5,MEFA:5,MECA:5,SSO:5,ECDIS:5,RADAR:5,ARPA:5,YF:10,CHOLERA:1,TANKER:5,GAS:5,BRM:5,SDSD:5,PASSPORT:10};
const OCR_MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12,ENE:1,ABR:4,AGO:8,DIC:12};
const o2=n=>String(n).padStart(2,'0');
function oIso(y,m,d){y=+y;m=+m;d=+d;if(y<1950||y>2100||m<1||m>12||d<1||d>31)return null;const t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!==m-1)return null;return y+'-'+o2(m)+'-'+o2(d)}
const oDig=s=>s.replace(/[OoQD]/g,'0').replace(/[Il|!]/g,'1').replace(/[Ss$]/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
/* Tìm mọi ngày trong chữ. Trả về {iso,pos,d1 (ngày chỉ có 1 chữ số → có thể bị mất số đầu)} */
function oDates(T){
 const out=[],push=(pos,y,m,d,raw)=>{const v=oIso(y,m,d);if(v)out.push({pos,iso:v,d1:String(raw).length===1})};let m;
 const D='([0-9OoIlSB]{1,2})',Y='([12][0-9OoIlSB]{3})',S='\\s*[\\/.\\-:,]\\s*';
 const r1=new RegExp('(?<![0-9])'+D+S+D+S+Y+'(?![0-9])','g');

 for(const l of L){const [x0,y0,x1,y1]=l.b,h=Math.max(8,y1-y0);

 let W=0,H=30;parts.forEach(q=>{W=Math.max(W,q[2]*q[4]);H+=q[3]*q[4]+40});
 const k=Math.min(1,2400/W,6000/H),cv=document.createElement('canvas');cv.width=Math.round(W*k)+40;cv.height=Math.round(H*k);

 for(const q of parts){const w=q[2]*q[4]*k,h=q[3]*q[4]*k;c.drawImage(F,q[0],q[1],q[2],q[3],20,y,w,h);y+=h+40*k}

 tm.push(Date.now());
 const P=[parseOcrText(best.text,key)],raw=[best.text];
 /* ảnh dựng thẳng ngay trong app để biết vị trí từng dòng */

 { /* luôn đọc thêm một lượt ảnh lọc nền vàng và dấu đỏ: nhiều lượt bỏ phiếu thì kết quả ổn định hơn giữa các lần quét */

const dupKey=v=>(v.rank&&(v.joinDate||v.contact))?[v.rank,(v.shipType&&v.shipType!=='Chưa rõ loại tàu'?v.shipType:''),v.joinDate||'',v.salaryMin,String(v.contact||'').replace(/\D/g,'')].join('|'):'';
const isReady=it=>it.status==='pending'&&!it.dup&&!it.scam&&!it.obj&&!it.miss.length&&!!it.v.contact;
const SEEKER_RE=/(tìm việc|xin việc|cần việc|cần tìm tàu|đang tìm tàu|tìm công ty|looking for (a )?(job|ship|vessel)|seeking (a )?(job|position)|cv của (mình|em|tôi))/i;
const HIRE_RE=/(tuyển|cần tìm|cần gấp|cần người|cần thuyền|cần \d|hiring|vacanc|wanted|recruit|crew change|nhập tàu|sign[ -]?on)/i;
const EDU_RE=/(tuyển sinh|khai giảng|học phí|khóa học|khoá học|bổ túc|lớp (học|thi|đào tạo))/i;
/* Chỉ giữ tin tuyển dụng: có chức danh nhận ra được, có dấu hiệu tuyển/lương, không phải bài tìm việc */
function isJobPost(b,v){
 if(!v.rank||!v.contact)return false;
 if(!HIRE_RE.test(b)&&!((v.salaryMin||v.negotiable)&&v.contact))return false;
 if(EDU_RE.test(b)&&!/tuyển (dụng|thuyền viên|gấp)|hiring|vacanc/i.test(b))return false;
 if(SEEKER_RE.test(b.slice(0,500))&&!/tuyển|hiring|vacanc|wanted/i.test(b))return false;
 return true;
}
const TRAINEE_RE=/(\btr\.|dcdt|ecdt|trainee|cadet|thực tập|học việc)/i;
function parseBatch(text){
 const out=[];
 String(text||'').split(/\n[ \t]*(?:-{3}|={3}|\*{3})[ \t]*(?:\n|$)/).forEach(b=>{
  let src='';const m=b.match(/^\s*(?:nguồn|source)\s*:\s*(.+)$/im);
  if(m){src=m[1].trim();b=b.replace(m[0],'')}
  b=b.trim();if(b.length<15)return;
  const lines=b.split('\n'),rl=[],hd=[];
  lines.forEach(l=>{if(TRAINEE_RE.test(l))return;const p=parseAd(l);if(p.rank&&p.salaryMin&&l.length<90)rl.push(l);else hd.push(l)});
  const multi=rl.length>=2,parts=multi?rl.map(l=>hd.join('\n')+'\n'+l):[b];
  parts.forEach((b,pi)=>{
  const v=parseAd(b),miss=[];
  if(multi){const pl=parseAd(rl[pi]);v.rank=pl.rank;v.salaryMin=pl.salaryMin;v.salaryMax=pl.salaryMax;v.cur=pl.cur;v.negotiable=false}
  if(!isJobPost(b,v)){out.skipped=(out.skipped||0)+1;return}
  if(!v.rank)miss.push('chức danh');if(!v.salaryMin&&!v.negotiable)miss.push('mức lương');
  v.companyId='cx';
  const key=dupKey(v),dup=!!key&&state.jobs.some(j=>dupKey({rank:j.rank,shipType:j.shipType,joinDate:j.joinDate,salaryMin:j.salaryMin,contact:j.contact})===key);
  out.push({id:'i'+Date.now()+Math.random().toString(36).slice(2,6),raw:b,source:src||'Nguồn chưa ghi',v:v,miss:miss,key:key,dup:dup,scam:scamText(b),obj:objText(b),status:'pending'});
  });
 });
 return out;
}

 it.status='done';
}

const SAVE_KEY='haitrinh.v1';
function saveState(){try{syncPush()}catch(e){}try{localStorage.setItem(SAVE_KEY,JSON.stringify({docs:state.docs,me:state.me,alert:state.alert,share:state.share,legalOK:state.legalOK,blocked:state.blocked,role:state.role==='sea'||state.role==='co'?state.role:null}))}catch(e){}}
function loadState(){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(o&&Array.isArray(o.docs)){state.docs=o.docs.filter(d=>CERT[d.key]).map(d=>CERT[d.key].noExpiry?Object.assign({},d,{expiry:null}):d);if(o.me)state.me=o.me;if(o.alert)state.alert=o.alert;state.share=!!o.share;state.legalOK=!!o.legalOK;state.blocked=o.blocked||[];if(o.role&&state.legalOK){state.role=o.role;state.tab='jobs'}}}catch(e){}}
loadState();
render();
fbInit();
</script>
